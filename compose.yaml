services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcampus_pwd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: smartcampus:1.0
    ports:
      - "8082:8080"        # host:container (8080 is already used by Jenkins)
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartcampus   # "db" = service name (Compose DNS)
      DB_USER: smartcampus
      DB_PASSWORD: ${DB_PASSWORD:-smartcampus_pwd}
      DATA_DIR: /data
    volumes:
      - smartcampus-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  smartcampus-data:
